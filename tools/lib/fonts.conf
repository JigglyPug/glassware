<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts every test browser sees (tools/lib/shot.js points Chromium here unless FONTCONFIG_FILE is
     already set, as tools/tests/audit.py does for phone sizes). Only these, from Ubuntu 24.04's fonts-inter,
     fonts-dejavu-core, fonts-dejavu-mono and fonts-noto-color-emoji, drawn the same way everywhere (grayscale antialiasing,
     no hinting), so a screenshot taken here matches one taken on GitHub's machine, which installs the
     same four packages (.github/workflows/checks.yml). The panels ask for system-ui, sans-serif or
     monospace: Inter answers the first two, DejaVu Sans Mono the last, DejaVu Sans any symbol Inter
     lacks, and Noto Color Emoji the emoji. -->
<fontconfig>
  <dir>/usr/share/fonts/opentype/inter</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <cachedir>/tmp/glassware-fontconfig-2</cachedir>
  <!-- Symbols Inter lacks (✦ ↻ → and the like) must always come from the same font. Four DejaVu files have
       them, and which one a browser picked depended on the machine (GitHub's drew a wider ✦ than this one).
       So only DejaVu Sans Regular keeps its arrows, symbols and dingbats; the others are scanned without. -->
  <match target="scan">
    <test name="family" compare="contains"><string>DejaVu</string></test>
    <test name="fullname" compare="not_eq"><string>DejaVu Sans</string></test>
    <edit name="charset" mode="assign"><minus><name>charset</name><charset><range><int>0x2190</int><int>0x2BFF</int></range></charset></minus></edit>
  </match>
  <!-- a folder can hold more on one machine than another (GitHub's noto folder has the whole Noto family),
       and a symbol Inter lacks would then come from a different font there: only these files count -->
  <selectfont>
    <rejectfont><glob>/usr/share/fonts/truetype/noto/*</glob></rejectfont>
    <acceptfont><glob>/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf</glob></acceptfont>
    <!-- likewise DejaVu: only the core and mono files, not fonts-dejavu-extra's if it's installed -->
    <rejectfont><glob>/usr/share/fonts/truetype/dejavu/*</glob></rejectfont>
    <acceptfont><glob>/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf</glob><glob>/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf</glob>
      <glob>/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf</glob><glob>/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf</glob>
      <glob>/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf</glob><glob>/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf</glob></acceptfont>
  </selectfont>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
  <!-- A family that isn't here (Kaleidoscope asks for AniList's Overpass first) falls back to sans-serif,
       as every desktop's fontconfig does (49-sansserif.conf). Without it, a symbol Inter lacks (✦) went to
       whichever font happened to sort first on that machine, so it drew differently on GitHub's. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>
  <alias><family>system-ui</family><prefer><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>ui-sans-serif</family><prefer><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>BlinkMacSystemFont</family><prefer><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>ui-monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
